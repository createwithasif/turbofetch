<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#5b5cf6"/>
      <stop offset="1" stop-color="#8b3dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="452" x2="0" y2="700">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="1" stop-color="#2ee6a6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile, inset like a macOS app icon -->
  <rect x="80" y="80" width="864" height="864" rx="200" fill="url(#tile)"/>
  <path d="M280 80h464a200 200 0 0 1 200 200v120C760 470 470 330 80 450V280A200 200 0 0 1 280 80z" fill="url(#shine)"/>

  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- The "A" -->
    <path d="M292 790 L512 236 L732 790" stroke="#ffffff" stroke-width="112"/>
    <!-- Download arrow in place of the crossbar -->
    <path d="M512 452 V690" stroke="url(#arrow)" stroke-width="78"/>
    <path d="M418 600 L512 694 L606 600" stroke="url(#arrow)" stroke-width="78"/>
  </g>
</svg>
